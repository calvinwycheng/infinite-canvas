services:
  azure-image-proxy:
    image: nginx:1.27-alpine
    container_name: azure-image-proxy
    ports:
      - "0.0.0.0:8787:8080"
    environment:
      NGINX_ENVSUBST_FILTER: ^$
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    depends_on:
      - request-transformer
    restart: unless-stopped

  request-transformer:
    image: node:22-alpine
    container_name: azure-image-request-transformer
    environment:
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT}
      AZURE_OPENAI_TOKEN: ${AZURE_OPENAI_TOKEN}
    volumes:
      - ./transformer.mjs:/app/transformer.mjs:ro
    command: ["node", "/app/transformer.mjs"]
    restart: unless-stopped
